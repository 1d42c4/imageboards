# Put this server block in your nginx configuration and adapt domain, paths and TLS.
# The document root MUST be public/, never the application directory.
server {
    listen 80;
    server_name chess.example;
    root /srv/vichan-modern/public;
    index index.html;
    autoindex off;
    client_max_body_size 136m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location ~ /\. { return 404; }
    location ~ ^/(?:var|src|views|bin|deploy|tests)(?:/|$) { return 404; }
    location ~ ^/(?:post|action|session|captcha|media|read|compose|search|mod)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Let application responses control caching; never cache sessions or moderator pages.
        fastcgi_cache off;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 90s;
    }
    location ~* \.(?:php|phtml|phar|ini|sql|sqlite|log|bat|ps1|md|json|lock|toml)$ { return 404; }
    location ~* \.(?:html|css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires -1;
    }
    location / { try_files $uri $uri/ =404; }
}
